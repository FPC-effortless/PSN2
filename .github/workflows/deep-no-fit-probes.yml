name: Deep architecture CPU probes (no fit)
on:
  pull_request:
    paths:
      - 'psn2/**'
      - 'train.py'
      - 'scripts/deep_neural_probe.py'
      - 'tests/test_deep_fix_regressions.py'
      - '.github/workflows/deep-no-fit-probes.yml'
permissions:
  contents: read
jobs:
  actual-source-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Boundary regression checks
        run: python tests/test_deep_fix_regressions.py
      - name: Actual source, no optimizer probes
        run: python scripts/deep_neural_probe.py ci-artifacts/deep-neural-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-source-no-fit-evidence
          path: ci-artifacts/
          retention-days: 30
